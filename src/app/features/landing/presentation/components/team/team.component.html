<section id="equipo" class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl md:text-4xl font-bold text-utp-blue text-center mb-4">Nuestro equipo</h2>
    <p class="text-gray-600 text-center max-w-2xl mx-auto mb-12">
      Las personas que impulsan el proyecto Smart Campus UTP Chiriquí.
    </p>

    <div class="grid sm:grid-cols-2 lg:grid-cols-2 gap-10 max-w-4xl mx-auto">
      @for (miembro of miembros; track miembro.nombre) {
        <article class="flex flex-col items-center text-center p-6 rounded-2xl bg-gray-50 border border-gray-100 hover:shadow-lg transition-shadow">
          <div class="w-32 h-32 rounded-full overflow-hidden bg-gray-200 mb-4 ring-4 ring-white shadow-lg flex-shrink-0">
            <img
              [src]="miembro.imagenUrl"
              [alt]="miembro.nombre"
              class="w-full h-full object-cover"
              loading="lazy"
              onerror="this.src='https://ui-avatars.com/api/?name='+encodeURIComponent(this.alt)+'&size=128&background=003366&color=fff'"
            />
          </div>
          <h3 class="text-xl font-bold text-gray-800">{{ miembro.nombre }}</h3>
          <p class="text-utp-accent font-medium mb-3">{{ miembro.cargo }}</p>
          <p class="text-gray-600 text-sm leading-relaxed">{{ miembro.descripcion }}</p>
        </article>
      }
    </div>
  </div>
</section>
