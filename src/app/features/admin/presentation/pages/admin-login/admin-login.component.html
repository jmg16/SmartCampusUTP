<section
  class="fixed inset-0 flex items-center justify-center bg-gradient-to-br from-utp-blue via-utp-accent to-slate-900 px-4 py-10"
>
  <div class="absolute inset-0 pointer-events-none opacity-20 mix-blend-soft-light">
    <div class="absolute -top-32 -right-40 h-80 w-80 rounded-full bg-sky-400 blur-3xl"></div>
    <div class="absolute -bottom-32 -left-40 h-80 w-80 rounded-full bg-emerald-300 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div
      class="mb-6 flex items-center justify-between gap-4 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 backdrop-blur"
    >
      <div class="flex items-center gap-3">
        <img
          src="assets/SmartCampus Logo sin letras.png"
          alt="Smart Campus UTP Chiriquí"
          class="h-9 w-auto object-contain"
        />
        <div class="text-xs text-blue-50">
          <p class="font-semibold tracking-wide uppercase text-[11px]">Smart Campus UTP</p>
          <p class="opacity-80">Panel administrativo</p>
        </div>
      </div>
      <img
        src="assets/6_logo_utp_-_rgb_oficial.png"
        alt="Universidad Tecnológica de Panamá"
        class="h-9 w-auto object-contain"
      />
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="enviar()"
      class="space-y-5 bg-white rounded-2xl shadow-xl px-6 py-7"
    >
      @if (error()) {
        <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-red-700 text-sm">
          {{ error() }}
        </div>
      }

      <div>
        <label for="usuario" class="block text-sm font-medium text-gray-700 mb-1">
          Usuario
        </label>
        <div class="relative">
          <span
            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
          >
            <!-- Heroicons outline: user -->
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5.121 17.804A4 4 0 019 15h6a4 4 0 013.879 2.804M15 9a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </span>
          <input
            id="usuario"
            type="text"
            formControlName="usuario"
            class="w-full rounded-lg border border-gray-300 pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-utp-blue focus:border-utp-blue outline-none transition"
            autocomplete="username"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña
        </label>
        <div class="relative">
          <span
            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
          >
            <!-- Heroicons outline: lock-closed -->
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 11V9a5 5 0 10-10 0v2M7 11h10a2 2 0 012 2v6a2 2 0 01-2 2H7a2 2 0 01-2-2v-6a2 2 0 012-2z"
              />
            </svg>
          </span>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full rounded-lg border border-gray-300 pl-9 pr-3 py-2.5 focus:ring-2 focus:ring-utp-blue focus:border-utp-blue outline-none transition"
            autocomplete="current-password"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid || cargando()"
        class="w-full py-2.5 rounded-xl bg-utp-blue text-white font-semibold shadow-sm hover:bg-utp-blue-dark disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      >
        @if (cargando()) {
          Iniciando sesión…
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</section>
